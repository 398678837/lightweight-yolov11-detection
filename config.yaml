# ============================================
# 轻量化YOLOv11图片检测Demo - 配置文件
# ============================================

# 模型配置
model:
  # 预训练模型名称（首次运行自动下载）
  # 可选: yolov11n / yolov11s / yolov11m / yolov11l / yolov11x
  # 说明: n=最轻量, s=轻量, m=中等, l=大, x=最大
  name: "yolov11n"
  # 或使用自定义模型路径，如 "weights/best.pt"（留空则用name）
  path: ""

# 推理配置
inference:
  # 置信度阈值（0-1，越高越严格）
  conf_threshold: 0.25
  # IoU阈值（NMS去重，0-1）
  iou_threshold: 0.45
  # 输入图片尺寸
  imgsz: 640
  # 设备: cpu / 0(GPU) / 0,1(多GPU)
  device: "cpu"
  # 是否保存可视化标注图
  save_visualization: true
  # 是否保存检测结果JSON
  save_json: true

# 路径配置
paths:
  # 输入图片文件夹（支持jpg/jpeg/png/bmp/tiff/webp）
  input_dir: "inputs"
  # 输出结果文件夹（自动创建）
  output_dir: "outputs"
  # 支持的图片格式
  image_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".bmp"
    - ".tiff"
    - ".webp"