# ============================================
# 轻量化YOLOv11红绿灯识别Demo - 配置文件
# ============================================

# 模型配置
model:
  # 模型路径（优先使用自定义训练权重）
  path: "weights/traffic_light_best.pt"
  # 预训练模型名称（当path为空时使用）
  # 可选: yolo11n / yolo11s / yolo11m / yolo11l / yolo11x
  name: "yolo11n"

# 推理配置
inference:
  # 置信度阈值（0-1，越高越严格）
  conf_threshold: 0.25
  # IoU阈值（NMS去重，0-1）
  iou_threshold: 0.45
  # 输入图片尺寸
  imgsz: 640
  # 设备: cpu / 0(GPU) / 0,1(多GPU)
  device: "cpu"
  # 是否保存可视化标注图
  save_visualization: true
  # 是否保存检测结果JSON
  save_json: true

# 红绿灯检测专有配置
traffic_light:
  # 启用红绿灯状态识别（自动根据模型类型启用）
  enabled: true
  # 红绿灯状态映射（模型输出的类别ID -> 中文状态）
  class_map:
    0: "绿灯"
    1: "红灯"
    2: "黄灯"
  # 各状态对应颜色（用于可视化标注）
  colors:
    green: [0, 255, 0]      # 绿灯 - 绿色
    red: [0, 0, 255]        # 红灯 - 红色
    yellow: [0, 255, 255]   # 黄灯 - 黄色
  # 危险状态（触发警告）
  danger_states:
    - "红灯"
    - "黄灯"

# 路径配置
paths:
  # 输入图片文件夹（支持jpg/jpeg/png/bmp/tiff/webp）
  input_dir: "inputs"
  # 输出结果文件夹（自动创建）
  output_dir: "outputs"
  # 支持的图片格式
  image_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".bmp"
    - ".tiff"
    - ".webp"